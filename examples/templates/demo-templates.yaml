# examples/templates/demo-templates.yaml
#
# Lightweight demo templates so the /create gallery has some variety to
# show. Each one has realistic-ish metadata (title, description, tags,
# spec.type) so the category strip + cards render meaningfully, but the
# `steps` are no-op `debug:log` actions — safe to "Use" without
# scaffolding anything real. Replace with proper scaffolders as the
# platform team builds them out.

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-grpc-service
  title: Go gRPC service
  description: Buf, OTel, Postgres, Helm chart, GitHub Actions CI.
  tags: [go, grpc, postgres, helm]
spec:
  owner: group:platform
  type: service
  parameters:
    - title: Service identity
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          description: Unique service name (kebab-case).
          pattern: '^[a-z][a-z0-9-]*$'
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group, User]
  steps:
    - id: log
      name: Log
      action: debug:log
      input:
        message: 'Demo template: would scaffold Go gRPC service "{{ parameters.name }}"'
  output:
    text:
      - title: Note
        content: This is a demo template. Wire up real scaffolder actions before using in anger.

